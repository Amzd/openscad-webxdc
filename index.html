<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
        />
        <script src="webxdc.js"></script>
        <title>OpenSCAD</title>
        <style>
            :root {
                --background: rgba(34, 34, 34, 0.94);
                --foreground: #fff;
                --toolbar-bg: rgba(30, 30, 30, 0.96);
                --panel-bg: #1a1a1a;
                --panel-border: #444;
                --btn-hover: #3a3a3a;
                --accent: #61b4d7;
            }

            *,
            *::before,
            *::after {
                box-sizing: border-box;
            }

            html,
            body {
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
                background: transparent;
                color: var(--foreground);
                font-family: monospace;
                overflow: hidden;
            }

            html {
                background: var(--background);
            }

            #workspace {
                position: fixed;
                inset: 50px 0 0;
                padding: 0 6px 6px;
                display: grid;
                gap: 6px;
                grid-template-columns: minmax(0, 1fr);
                grid-template-rows: minmax(0, 1.2fr) minmax(0, 0.92fr);
            }

            .panel {
                min-width: 0;
                min-height: 0;
                overflow: hidden;
                display: grid;
                grid-template-rows: auto minmax(0, 1fr);
                border: 1px solid var(--panel-border);
                border-radius: 8px;
                background: var(--panel-bg);
            }

            .panel-heading {
                min-height: 28px;
                padding: 4px 8px;
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 8px;
                border-bottom: 1px solid var(--panel-border);
                background: var(--toolbar-bg);
                font-size: 12px;
            }

            .panel-title {
                font-weight: 700;
            }

            .small-meta {
                color: #888;
                font-size: 11px;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .state-pill {
                padding: 1px 8px;
                border-radius: 999px;
                font-size: 11px;
                color: #4db870;
                background: rgba(77, 184, 112, 0.15);
            }

            .state-pill.draft {
                color: #e5a33d;
                background: rgba(229, 163, 61, 0.15);
            }

            #editor {
                width: 100%;
                height: 100%;
                min-height: 0;
                resize: none;
                padding: 12px;
                border: 0;
                outline: 0;
                color: #eee;
                background: transparent;
                font: 14px/1.5 monospace;
                tab-size: 4;
                overflow: auto;
            }

            .shared-views {
                min-width: 0;
                min-height: 0;
                display: grid;
                grid-template-rows: auto minmax(0, 1fr);
                gap: 6px;
            }

            .shared-views > .panel {
                display: none;
            }

            .shared-views > .panel.mobile-active {
                display: grid;
            }

            .mobile-shared-tabs {
                display: flex;
                border: 1px solid var(--panel-border);
                border-radius: 8px;
                min-width: 0;
                overflow-x: auto;
                overflow-y: hidden;
                background: var(--toolbar-bg);
            }

            .tab {
                padding: 5px 10px;
                border: 0;
                border-bottom: 2px solid transparent;
                color: #888;
                background: transparent;
                font: 600 12px monospace;
                cursor: pointer;
            }

            .tab.active {
                color: var(--accent);
                border-bottom-color: var(--accent);
            }

            .panel-content {
                min-height: 0;
                padding: 8px;
                overflow: auto;
            }

            #peers-panel {
                grid-template-rows: minmax(0, 1fr);
                border: 0;
                border-radius: 0;
                background: transparent;
            }

            #peers-content.peer-grid {
                display: grid;
                grid-template-columns: repeat(
                    auto-fit,
                    minmax(min(280px, 100%), 1fr)
                );
                align-content: start;
                gap: 8px;
            }

            #peers-content.peer-tabs-mode .peer-heading {
                display: none;
            }

            .mobile-shared-tabs .tab {
                flex: 0 0 auto;
            }

            .mobile-shared-tabs .tab[data-peer] {
                max-width: 180px;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .empty-state {
                padding: 6px;
                color: #888;
                font-size: 12px;
                line-height: 1.4;
            }

            .peer-card {
                display: grid;
                grid-template-rows: auto minmax(0, 1fr);
                min-width: 0;
                overflow: hidden;
                border: 1px solid var(--panel-border);
                border-radius: 8px;
                background: var(--panel-bg);
            }

            .peer-heading {
                display: flex;
                align-items: center;
                min-height: 28px;
                padding: 4px 8px;
                border-bottom: 1px solid var(--panel-border);
                background: var(--toolbar-bg);
                font-size: 11px;
            }

            .peer-heading strong {
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .viewer {
                margin: 0;
                padding: 8px;
                color: #ddd;
                font: 12px/1.5 monospace;
                white-space: pre-wrap;
                overflow-wrap: anywhere;
            }

            .viewer-line {
                display: inline;
            }

            .viewer-line.changed {
                background: rgba(229, 163, 61, 0.18);
            }

            .viewer-cursor {
                display: inline-block;
                height: 1em;
                border-left: 2px solid #4db870;
                vertical-align: text-bottom;
            }

            .render-summary p {
                margin: 0 0 8px;
                color: #4db870;
                font-size: 12px;
            }

            .model-preview-container {
                height: min(42vh, 360px);
                min-height: 180px;
                margin-bottom: 10px;
                overflow: hidden;
                border: 1px solid var(--panel-border);
                border-radius: 6px;
                background: radial-gradient(circle at center, #343a40, #17191b);
            }

            .model-preview {
                width: 100%;
                height: 100%;
                cursor: grab;
            }

            .model-preview:active {
                cursor: grabbing;
            }

            .model-preview canvas {
                display: block;
                width: 100%;
                height: 100%;
            }

            .render-details {
                margin: 0 0 8px;
                color: #aaa;
                font-size: 12px;
            }

            .render-details summary {
                padding: 6px 0;
                cursor: pointer;
            }

            .render-source,
            .render-logs {
                margin: 0;
                color: #ddd;
                font: 12px/1.5 monospace;
                white-space: pre-wrap;
                overflow-wrap: anywhere;
            }

            .render-logs {
                color: #999;
            }

            .render-summary p.preview-error {
                margin: 8px 0;
                color: #e5a33d;
                font-size: 12px;
            }

            @media (min-width: 560px) and (min-aspect-ratio: 6/5) {
                #workspace {
                    grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.85fr);
                    grid-template-rows: minmax(0, 1fr);
                }

                .shared-views {
                    display: contents;
                }

                .mobile-shared-tabs {
                    display: none;
                }

                #workspace.peer-tabs-mode {
                    grid-template-rows:
                        minmax(0, 1fr) minmax(0, 0.72fr)
                        auto;
                }

                #workspace.peer-tabs-mode .mobile-shared-tabs {
                    display: flex;
                    grid-column: 1 / -1;
                    grid-row: 3;
                }

                .shared-views > .panel {
                    display: grid;
                }

                #running-panel {
                    grid-column: 2;
                    grid-row: 1;
                }

                #peers-panel {
                    display: none;
                    grid-column: 1 / -1;
                    grid-row: 2;
                }

                #workspace.has-peers {
                    grid-template-rows: minmax(0, 1fr) minmax(0, 0.72fr);
                }

                #workspace.has-peers #peers-panel {
                    display: grid;
                }
            }

            #toolbar {
                position: fixed;
                top: 6px;
                left: 6px;
                right: 6px;
                height: 38px;
                display: flex;
                align-items: center;
                gap: 6px;
                padding: 0 8px;
                background: var(--toolbar-bg);
                border: 1px solid var(--panel-border);
                border-radius: 8px;
                z-index: 100;
            }

            #toolbar button {
                min-height: 30px;
                padding: 0 10px;
                background: transparent;
                border: 1px solid transparent;
                border-radius: 6px;
                color: var(--foreground);
                font: 12px monospace;
                cursor: pointer;
            }

            #toolbar button:hover {
                background: var(--btn-hover);
                border-color: var(--panel-border);
            }

            #toolbar button:disabled {
                opacity: 0.35;
                cursor: default;
            }

            #toolbar button.primary {
                color: var(--accent);
                font-weight: 700;
            }

            #toolbar .spacer {
                flex: 1;
            }

            #toolbar .status {
                font-size: 12px;
                color: #888;
                max-width: 45%;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            #toolbar .status.error {
                color: #e55;
            }

            #shared-notice {
                position: fixed;
                top: 56px;
                left: 50%;
                transform: translateX(-50%);
                background: rgba(40, 100, 60, 0.92);
                color: #fff;
                font-size: 13px;
                padding: 6px 14px;
                border-radius: 20px;
                z-index: 200;
                display: none;
                pointer-events: none;
            }

            #shared-notice.show {
                display: block;
            }
        </style>
    </head>
    <body>
        <main id="workspace">
            <section id="editor-panel" class="panel">
                <div class="panel-heading">
                    <span class="panel-title">OpenSCAD code</span>
                    <span id="editor-state" class="state-pill"
                        >Not rendered yet</span
                    >
                </div>
                <textarea
                    id="editor"
                    aria-label="OpenSCAD source code"
                    spellcheck="false"
                    autocapitalize="off"
                    autocomplete="off"
                ></textarea>
            </section>
            <div id="shared-views" class="shared-views">
                <div
                    id="mobile-shared-tabs"
                    class="mobile-shared-tabs"
                    role="tablist"
                ></div>
                <section id="running-panel" class="panel mobile-active">
                    <div class="panel-heading">
                        <span class="panel-title">Rendered STL</span>
                        <span id="running-meta" class="small-meta"></span>
                    </div>
                    <div id="running-content" class="panel-content"></div>
                </section>
                <section id="peers-panel" class="panel">
                    <div id="peers-content" class="panel-content"></div>
                </section>
            </div>
        </main>

        <div id="toolbar">
            <button id="render-btn" class="primary" title="Render (Ctrl+Enter)">
                Render
            </button>
            <button
                id="download-btn"
                title="Download the rendered STL"
                disabled
            >
                Download STL
            </button>
            <div class="spacer"></div>
            <span id="status-text" class="status"></span>
        </div>

        <div id="shared-notice">Code received — render to create your STL</div>

        <script type="module" src="src/index.js"></script>
    </body>
</html>
